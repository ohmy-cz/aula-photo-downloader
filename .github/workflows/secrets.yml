name: Scan for secrets
on:
  workflow_call:
    inputs:
      artifact:
        description: Build artifact to scan; omit to scan source and history
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: inputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/release-scan
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and Git history
        if: inputs.artifact == ''
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --max-archive-depth 3 --ignore-gitleaks-allow --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--all" --max-archive-depth 3 --ignore-gitleaks-allow --redact --no-banner
      - name: Scan release ZIP and nested source archives
        if: inputs.artifact != ''
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/release-scan" --config .gitleaks.toml --max-archive-depth 3 --ignore-gitleaks-allow --redact --no-banner'
